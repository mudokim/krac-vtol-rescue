# krac_gimbal / gimbal_node 파라미터
# 프리셋 각도는 여기서 자유롭게 수정하세요. 실행 시 하드웨어 한계로 자동 클램프됩니다.
/gimbal_node:
  ros__parameters:
    # ---- 네트워크 (A8 mini 기본값) ----
    ip: "192.168.144.25"
    port: 37260

    # ---- A8 mini 하드웨어 각도 한계 (SIYI SDK cameras.py 기준) ----
    #   pitch: -90(직하방) ~ +25(상향),  yaw: -135 ~ +135
    pitch_min: -90.0
    pitch_max: 25.0
    yaw_min: -135.0
    yaw_max: 135.0

    # ---- 동작 주기 ----
    hold_rate_hz: 2.0            # 활성 프리셋 각도 재전송(패킷 손실 대비). 0 이면 끔
    attitude_pub_rate_hz: 10.0   # /gimbal/attitude 퍼블리시 주기

    # ---- 프리셋: [yaw_deg, pitch_deg] ----
    preset1: [0.0, 0.0]     # 1번: 중립 (전방 수평)
    preset2: [0.0, -90.0]   # 2번: 90도 = 직하방 (마커/생존자 하방 촬영)
    # 3번: "180도" 는 A8 mini pitch 물리한계(+25)로 완전 뒤집기가 불가.
    #   - 아래 기본값은 "최대 상향(+25)" 으로 대체한 값입니다.
    #   - 만약 '뒤돌아보기(yaw 회전)' 의도라면 예: [135.0, 0.0] 로 바꾸세요(최대 ±135).
    preset3: [0.0, 25.0]

    # ---- 기동 직후 자동 유지 프리셋 ----
    # krac24 미션은 REP 도착 전까지 항상 직하(preset2)를 보고 있어야 하므로,
    # 노드가 뜨자마자(토픽 수신 전) 이 프리셋을 자동으로 물게 한다. 0 이면 안 물림.
    boot_preset: 2
